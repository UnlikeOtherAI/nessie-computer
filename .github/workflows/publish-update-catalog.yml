name: Publish Update Catalogue

# Signs metadata for packages already attached to an immutable executor-v<version>
# release, archives the signed bytes immutably, then advances the existing mutable
# channel. Only protected main with green source CI may sign.
on:
  workflow_dispatch:
    inputs:
      channel:
        description: Update channel
        type: choice
        options: [preview, stable]
        default: preview
      version:
        description: Release version whose executor-v<version> assets are published
        required: true
      source_commit:
        description: Full source revision compiled into those packages
        required: true
      sequence:
        description: Optional sequence (otherwise advance the signed channel automatically)
        required: false

permissions:
  contents: write
concurrency:
  group: update-catalog
  cancel-in-progress: false

jobs:
  publish:
    name: Sign and publish
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    environment: executor-updates
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Download the release's packages
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
          SOURCE_COMMIT: ${{ inputs.source_commit }}
        run: |
          release_commit=$(gh api "repos/$GITHUB_REPOSITORY/commits/executor-v$VERSION" --jq .sha)
          if [ "$release_commit" != "$SOURCE_COMMIT" ]; then
            echo "The release tag does not match the requested source revision." >&2
            exit 1
          fi
          mkdir -p "$RUNNER_TEMP/assets"
          gh release download "executor-v$VERSION" --repo "$GITHUB_REPOSITORY" --dir "$RUNNER_TEMP/assets" \
            --pattern "NessieExecutor_${VERSION}_*.dmg" --pattern "NessieExecutor_${VERSION}_*.msi" \
            --pattern "nessie-executor_${VERSION}_*.deb" --pattern "nessie-executor_${VERSION}_*.rpm" \
            --pattern "nessie-executor_${VERSION}_*.deb.asc" --pattern "nessie-executor_${VERSION}_*.rpm.asc"
      - name: Archive and publish the signed catalogue
        env:
          GH_TOKEN: ${{ github.token }}
          CHANNEL: ${{ inputs.channel }}
          VERSION: ${{ inputs.version }}
          SOURCE_COMMIT: ${{ inputs.source_commit }}
          SEQUENCE: ${{ inputs.sequence }}
          EXECUTOR_UPDATE_SIGNING_KEY: ${{ secrets.EXECUTOR_UPDATE_SIGNING_KEY }}
        run: pnpm exec tsx packaging/updates/publish-catalog.mjs "$RUNNER_TEMP/assets" "$RUNNER_TEMP/publication"
