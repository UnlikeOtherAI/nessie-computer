name: Publish Update Catalogue

# Signs metadata for packages already attached to an immutable executor-v<version>
# release and replaces that channel's catalogue. Only protected main may sign.
on:
  workflow_dispatch:
    inputs:
      channel:
        description: Update channel
        type: choice
        options: [preview, stable]
        default: preview
      version:
        description: Release version whose executor-v<version> assets are published
        required: true
      source_commit:
        description: Full source revision compiled into those packages
        required: true
      sequence:
        description: Catalogue sequence, higher than the channel's previous one
        required: true

permissions:
  contents: write
concurrency:
  group: update-catalog
  cancel-in-progress: false

jobs:
  publish:
    name: Sign and publish
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    environment: executor-updates
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Download the release's packages
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
        run: |
          mkdir -p "$RUNNER_TEMP/assets"
          gh release download "executor-v$VERSION" --repo "$GITHUB_REPOSITORY" --dir "$RUNNER_TEMP/assets" \
            --pattern '*.dmg' --pattern '*.msi' --pattern '*.deb' --pattern '*.rpm'
      - name: Compose and sign
        env:
          CHANNEL: ${{ inputs.channel }}
          VERSION: ${{ inputs.version }}
          SOURCE_COMMIT: ${{ inputs.source_commit }}
          SEQUENCE: ${{ inputs.sequence }}
          EXECUTOR_UPDATE_SIGNING_KEY: ${{ secrets.EXECUTOR_UPDATE_SIGNING_KEY }}
        run: |
          node packaging/updates/compose-catalog.mjs "$RUNNER_TEMP/assets" "$RUNNER_TEMP/manifest.json"
          cat "$RUNNER_TEMP/manifest.json"
          pnpm exec tsx packaging/updates/sign-catalog.mjs "$RUNNER_TEMP/manifest.json" "$RUNNER_TEMP/catalog.json"
      - name: Replace the channel catalogue
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: update-catalog-${{ inputs.channel }}
        run: |
          if ! gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --prerelease --latest=false \
              --title "Executor update catalogue ($TAG)" --notes "Signed update metadata. Not an installer."
          fi
          gh release upload "$TAG" "$RUNNER_TEMP/catalog.json" --repo "$GITHUB_REPOSITORY" --clobber
