name: CI

on:
  push:
    branches: ['**']
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  TURBO_TELEMETRY_DISABLED: '1'

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm verify

  native:
    name: Native (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022, macos-15]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - run: cargo test --locked --manifest-path native/Cargo.toml --jobs 2
      - if: runner.os == 'Windows'
        run: |
          cargo test --locked --manifest-path windows-common/Cargo.toml --jobs 2
          cargo test --locked --manifest-path service-windows/Cargo.toml --jobs 2
      - if: runner.os == 'Linux'
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache-dependency-path: guest/go.sum
      - if: runner.os == 'Linux'
        working-directory: guest
        run: sudo "$(command -v go)" test ./...
      - if: runner.os == 'macOS'
        run: swift test --package-path vm
