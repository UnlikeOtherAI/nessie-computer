[package]
name = "nessie-executor-native"
version = "0.1.0"
edition = "2021"
publish = false

[features]
# Opt-in real installed probe. This adds no production admission bypass.
retained-issuer-installed-qualification = []

[[test]]
name = "retained_issuer_installed"
path = "tests/retained_issuer_installed.rs"
required-features = ["retained-issuer-installed-qualification"]

# What Windows names this executable in Task Manager and its properties; the
# icon beside it is embedded by build.rs.
[package.metadata.tauri-winres]
FileDescription = "Nessie Computer Helper"
ProductName = "Nessie Computer"

[[bin]]
name = "nessie-executor-native"
path = "src/main.rs"

[dependencies]
base64 = "0.22.1"
hmac = "0.12.1"
ed25519-dalek = { version = "3.0.0", features = ["pem"] }
libc = "0.2.182"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
sha2 = "0.10.9"
nessie-executor-updater = { path = "../updater" }

[dev-dependencies]
tempfile = "3.24.0"

# Only the Win32 surfaces the helper's commands need: token and SID reads, the
# DACL get/set pair and the file access mask they grant for state security;
# the Job Object, the process snapshot and the wait for `job-run`.
[target."cfg(windows)".dependencies]
portable-pty = "0.9.0"
windows-service = "0.8.1"
nessie-windows-provenance = { path = "../windows-provenance" }
nessie-windows-common = { path = "../windows-common" }
windows-sys = { version = "0.61.2", features = [
  "Win32_Foundation",
  "Win32_Security",
  "Win32_Security_Authorization",
  "Win32_Security_Cryptography",
  "Win32_Storage_FileSystem",
  "Win32_System_Diagnostics_ToolHelp",
  "Win32_System_JobObjects",
  "Win32_System_IO",
  "Win32_System_Environment",
  "Win32_System_RemoteDesktop",
  "Win32_System_Pipes",
  "Win32_System_Services",
  "Win32_System_ApplicationInstallationAndServicing",
  "Win32_System_Com",
  "Win32_System_Threading",
  "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

# Embeds the icon and version information (build.rs); Windows builds only.
[target."cfg(windows)".build-dependencies]
tauri-winres = "0.3.6"
