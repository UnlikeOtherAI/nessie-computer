<!doctype html>
<html lang="en-GB">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>Nessie Computer</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- One dropdown above the tabs picks the team every tab shows; its last entry starts pairing. -->
  <div class="team-row" id="team-row">
    <label for="team-select" id="team-select-label"></label>
    <select id="team-select"></select>
  </div>
  <ul id="needs-you-list" class="needs" aria-labelledby="team-select-label" hidden></ul>
  <div class="tabs" id="tablist" role="tablist">
    <button role="tab" id="tab-button-access" data-tab="access" aria-controls="tab-access" aria-selected="true"></button>
    <button role="tab" id="tab-button-documents" data-tab="documents" aria-controls="tab-documents" aria-selected="false" tabindex="-1"></button>
    <button role="tab" id="tab-button-ai" data-tab="ai" aria-controls="tab-ai" aria-selected="false" tabindex="-1"></button>
    <button role="tab" id="tab-button-settings" data-tab="settings" aria-controls="tab-settings" aria-selected="false" tabindex="-1"></button>
  </div>
  <p id="error" class="tab-error" role="alert" hidden></p>
  <main>
    <div id="no-team" hidden>
      <button id="no-team-connect" class="primary"></button>
    </div>
    <section id="tab-access" role="tabpanel" aria-labelledby="tab-button-access" hidden></section>
    <section id="tab-documents" role="tabpanel" aria-labelledby="tab-button-documents" hidden></section>
    <section id="tab-ai" role="tabpanel" aria-labelledby="tab-button-ai" hidden></section>
    <section id="tab-settings" role="tabpanel" aria-labelledby="tab-button-settings" hidden>
      <section id="retained-import" hidden aria-labelledby="retained-title">
        <h2 id="retained-title"></h2>
        <p id="retained-baseline" class="hint"></p>
        <label id="retained-root-label" for="retained-root"></label>
        <select id="retained-root"></select>
        <div class="actions"><button id="retained-offer" type="button"></button><button id="retained-refresh" type="button"></button></div>
        <div id="retained-requests"></div>
        <p id="retained-status" role="status"></p>
        <button id="retained-revoke" type="button" hidden></button>
        <p id="retained-error" role="alert" hidden></p>
      </section>
      <p class="tab-error" role="alert" hidden></p>
      <section id="settings-team" class="settings-team" aria-labelledby="settings-team-title" hidden>
        <div class="row">
          <span id="settings-team-title" class="status-word"></span>
          <button id="settings-pause"></button>
          <button id="settings-disconnect"></button>
        </div>
      </section>
      <label class="toggle"><input type="checkbox" id="autostart"><span id="autostart-label"></span></label>
      <label class="toggle"><input type="checkbox" id="auto-restart"><span id="auto-restart-label"></span></label>
      <section id="software-updates" aria-labelledby="update-title">
        <h2 id="update-title"></h2>
        <p><span id="update-version-label"></span>: <strong id="update-version"></strong></p>
        <div id="update-policy" hidden>
          <label class="toggle"><input type="checkbox" id="update-automatic"><span id="update-automatic-label"></span></label>
        </div>
        <p id="update-status" role="status"></p>
        <div class="update-actions"><button id="update-setup" class="primary" hidden></button><button id="update-check"></button><button id="update-install" class="primary" hidden></button></div>
        <p id="update-error" class="update-error" role="alert" hidden></p>
      </section>
      <section id="help" class="settings-block">
        <div class="actions start"><button id="open-logs"></button></div>
      </section>
    </section>
  </main>
  <footer>
    <button id="open-nessie"></button>
    <div id="save-status" role="status"></div>
  </footer>

  <dialog id="update-dialog" aria-labelledby="update-prompt-title" aria-describedby="update-prompt-body">
    <h2 id="update-prompt-title"></h2>
    <p id="update-prompt-body"></p>
    <p id="update-prompt-error" class="update-error" role="alert" hidden></p>
    <div class="actions"><button id="update-prompt-remind"></button><button id="update-prompt-install" class="primary"></button></div>
  </dialog>

  <dialog id="connect-dialog" aria-labelledby="connect-title">
    <h2 id="connect-title" tabindex="-1"></h2>
    <p id="pairing-getting" role="status" hidden></p>
    <section id="connect-progress" hidden>
      <div id="code-row"><output id="pairing-code"></output><button id="copy-code"></button></div>
      <p id="pairing-time" class="hint"></p>
      <p id="pairing-instruction"></p>
    </section>
    <details id="connect-advanced">
      <summary id="connect-advanced-summary"></summary>
      <div class="label-row"><label for="pairing-server" id="pairing-server-label"></label></div>
      <input id="pairing-server" type="url" required aria-errormessage="pairing-server-error">
      <p id="pairing-server-error" class="field-error" role="alert" hidden></p>
      <div class="actions start"><button id="pairing-server-use"></button></div>
    </details>
    <p id="pairing-error" class="dialog-error" role="alert" hidden></p>
    <div class="actions">
      <button id="pairing-stop"></button>
      <button id="pairing-renew" class="primary" hidden></button>
      <button id="pairing-open-nessie" class="primary" hidden></button>
    </div>
    <p id="pairing-announce" class="visually-hidden" role="status"></p>
  </dialog>

  <dialog id="disconnect-dialog" aria-labelledby="disconnect-title">
    <h2 id="disconnect-title" tabindex="-1"></h2>
    <p id="disconnect-body"></p>
    <p class="dialog-error" role="alert" hidden></p>
    <div class="actions"><button type="button" id="disconnect-cancel" class="dialog-close"></button><button id="disconnect-confirm" class="danger"></button></div>
  </dialog>

  <script src="native.js"></script>
  <script src="i18n.js"></script>
  <script src="help.js"></script>
  <script src="main.js"></script>
  <script src="errors-words.js"></script>
  <script src="errors.js"></script>
  <script src="teams-words.js"></script>
  <script src="teams.js"></script>
  <script src="needs-words.js"></script>
  <script src="needs.js"></script>
  <script src="pairing-words.js"></script>
  <script src="pairing.js"></script>
  <script src="updates-words.js"></script>
  <script src="updates.js"></script>
  <script src="settings-words.js"></script>
  <script src="settings.js"></script>
  <!-- Team tabs: the save queue and drafts first, then each tab's words before its module. -->
  <script src="autosave.js"></script>
  <script src="team-drafts.js"></script>
  <script src="access-words.js"></script>
  <script src="access.js"></script>
  <script src="access-sections.js"></script>
  <script src="access-programs.js"></script>
  <script src="documents-reasons-words.js"></script>
  <script src="documents-words.js"></script>
  <script src="documents.js"></script>
  <script src="ai-local-words.js"></script>
  <script src="ai-local.js"></script>
  <script src="ai-words.js"></script>
  <script src="ai.js"></script>
  <script src="chatgpt-words.js"></script>
  <script src="chatgpt.js"></script>
  <script src="ai-connection.js"></script>
  <script src="inference-endpoints.js"></script>
  <script src="retained-import.js"></script>
</body>
</html>
