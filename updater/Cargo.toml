[package]
name = "nessie-executor-updater"
version = "1.0.0"
edition = "2021"
publish = false
license-file = "../LICENSE"

[lib]
name = "nessie_executor_updater"
path = "src/lib.rs"

[dependencies]
base64 = "0.22.1"
chrono = { version = "0.4.42", default-features = false, features = ["clock", "std"] }
ed25519-dalek = { version = "3.0.0", features = ["pem"] }
fs2 = "0.4.3"
libc = "0.2.182"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
sha2 = "0.10.9"
ureq = { version = "3.4.2", default-features = false, features = ["rustls"] }
uuid = { version = "1.20.0", features = ["v4"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Storage_FileSystem"] }

[dev-dependencies]
tempfile = "3.24.0"
